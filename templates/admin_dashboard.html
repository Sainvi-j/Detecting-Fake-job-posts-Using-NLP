<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Dashboard - Sainvi</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        margin: 0;
        padding: 40px;
        min-height: 100vh;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        text-align: center;
      }
      h1 {
        color: #4a00e0;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin: 30px 0;
      }
      .stat-card {
        background: #f8f9fa;
        padding: 25px;
        border-radius: 15px;
        border-left: 6px solid #8e2de2;
      }
      .stat-card h3 {
        margin: 0;
        font-size: 2.5em;
        color: #4a00e0;
      }
      .stat-card p {
        margin: 8px 0 0;
        color: #666;
        font-weight: 600;
      }
      .fake {
        color: #e74c3c;
      }
      .real {
        color: #27ae60;
      }
      .btn-group {
        margin: 30px 0;
      }
      .btn {
        display: inline-block;
        padding: 14px 30px;
        margin: 10px;
        background: #8e2de2;
        color: white;
        text-decoration: none;
        border-radius: 12px;
        font-weight: 600;
        transition: 0.3s;
      }
      .btn:hover {
        background: #7919c2;
        transform: translateY(-3px);
      }
      .btn.logout {
        background: #e74c3c;
      }
      .btn.logout:hover {
        background: #c0392b;
      }
      footer {
        margin-top: 60px;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Admin Dashboard</h1>
      <p>Welcome back, <strong>Admin</strong> • Secure Analytics Panel</p>

      <div class="stats-grid">
        <div class="stat-card">
          <h3>{{ total }}</h3>
          <p>Total Predictions</p>
        </div>
        <div class="stat-card">
          <h3 class="fake">{{ fake }}</h3>
          <p>Fake Jobs Detected</p>
        </div>
        <div class="stat-card">
          <h3 class="real">{{ real }}</h3>
          <p>Real Jobs Verified</p>
        </div>
      </div>

      <div class="btn-group">
        <a href="/history" class="btn">View Full History</a>
        <a href="/" class="btn">Back to Detector</a>
        <a href="/logout" class="btn logout">Logout</a>
      </div>

      <footer>
        <p>
          Secure Admin Panel • Made with ❤️ by <strong>Sainvi</strong> •
          November 2025
        </p>
      </footer>
    </div>
  </body>
</html>
