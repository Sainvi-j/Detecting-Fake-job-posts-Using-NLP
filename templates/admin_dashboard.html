<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Dashboard - Sainvi</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        margin: 0;
        padding: 40px;
        min-height: 100vh;
        color: #333;
      }
      .container {
        max-width: 1100px;
        margin: 0 auto;
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      }
      h1 {
        text-align: center;
        color: #4a00e0;
        margin-bottom: 10px;
      }
      p.subtitle {
        text-align: center;
        color: #666;
        font-size: 1.1em;
        margin-bottom: 40px;
      }
      .charts-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        margin-bottom: 40px;
      }
      .chart-container {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }
      .full-width {
        grid-column: 1 / -1;
      }
      canvas {
        max-height: 320px !important;
      }
      .btn-group {
        text-align: center;
        margin: 40px 0;
      }
      .btn {
        display: inline-block;
        padding: 14px 30px;
        margin: 10px;
        background: #8e2de2;
        color: white;
        text-decoration: none;
        border-radius: 12px;
        font-weight: 600;
        transition: 0.3s;
      }
      .btn:hover {
        background: #7919c2;
        transform: translateY(-3px);
      }
      .btn.logout {
        background: #e74c3c;
      }
      .btn.logout:hover {
        background: #c0392b;
      }
      footer {
        text-align: center;
        color: #aaa;
        margin-top: 50px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Admin Analytics Dashboard</h1>
      <p class="subtitle">Real-time insights from your AI Fake Job Detector</p>

      <!-- 3 CHARTS: Pie, Bar, Line -->
      <div class="charts-grid">
        <!-- PIE CHART -->
        <div class="chart-container">
          <canvas id="pieChart"></canvas>
        </div>

        <!-- BAR CHART: Average Confidence -->
        <div class="chart-container">
          <canvas id="barChart"></canvas>
        </div>

        <!-- LINE CHART: Daily Trend (Full Width) -->
        <div class="chart-container full-width">
          <canvas id="lineChart"></canvas>
        </div>
      </div>

      <div class="btn-group">
        <a href="/history" class="btn">View Full History</a>
        <a href="/" class="btn">Back to Detector</a>
        <a href="/logout" class="btn logout">Logout</a>
      </div>

      <footer>
        <p>
          Secure Analytics Panel • Made with ❤️ by <strong>Sainvi</strong> •
          November 2025
        </p>
      </footer>
    </div>

    <script>
      // PIE CHART - Fake vs Real Ratio
      new Chart(document.getElementById('pieChart'), {
          type: 'doughnut',
          data: {
              labels: ['Fake Jobs', 'Real Jobs'],
              datasets: [{
                  data: [{{ fake }}, {{ real }}],
                  backgroundColor: ['#e74c3c', '#2ecc71'],
                  borderWidth: 3,
                  borderColor: '#fff'
              }]
          },
          options: {
              responsive: true,
              plugins: {
                  title: { display: true, text: 'Fake vs Real Jobs', font: { size: 16 } },
                  legend: { position: 'bottom' }
              }
          }
      });

      // BAR CHART - Average Confidence per Prediction Type
      new Chart(document.getElementById('barChart'), {
          type: 'bar',
          data: {
              labels: ['Fake Jobs', 'Real Jobs'],
              datasets: [{
                  label: 'Average Confidence (%)',
                  data: [{{ "%.2f" % avg_fake_conf|default(0) }}, {{ "%.2f" % avg_real_conf|default(0) }}],
                  backgroundColor: ['#e74c3c', '#2ecc71'],
                  borderRadius: 8
              }]
          },
          options: {
              responsive: true,
              plugins: {
                  title: { display: true, text: 'Average Confidence Level', font: { size: 16 } }
              },
              scales: {
                  y: { beginAtZero: true, max: 100 }
              }
          }
      });

      // LINE CHART - Daily Predictions Trend
      new Chart(document.getElementById('lineChart'), {
          type: 'line',
          data: {
              labels: {{ dates|safe }},
              datasets: [{
                  label: 'Predictions Per Day',
                  data: {{ counts|safe }},
                  borderColor: '#8e2de2',
                  backgroundColor: 'rgba(142, 45, 226, 0.1)',
                  borderWidth: 3,
                  fill: true,
                  tension: 0.4,
                  pointBackgroundColor: '#8e2de2'
              }]
          },
          options: {
              responsive: true,
              plugins: {
                  title: { display: true, text: 'Daily Prediction Trend', font: { size: 18 } }
              },
              scales: {
                  y: { beginAtZero: true }
              }
          }
      });
    </script>
  </body>
</html>
