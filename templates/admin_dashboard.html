<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Dashboard - Sainvi</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        margin: 0;
        padding: 0;
        min-height: 100vh;
        color: #333;
        display: flex;
      }

      /* SIDEBAR */
      .sidebar {
        width: 280px;
        background: rgba(255, 255, 255, 0.95);
        padding: 40px 20px;
        box-shadow: 10px 0 30px rgba(0, 0, 0, 0.2);
        height: 100vh;
        position: fixed;
        left: 0;
        top: 0;
        overflow-y: auto;
      }
      .sidebar h2 {
        text-align: center;
        color: #4a00e0;
        margin-bottom: 50px;
        font-size: 1.8em;
      }
      .nav-btn {
        display: block;
        width: 85%;
        padding: 16px 20px;
        margin: 12px 0;
        background: #8e2de2;
        color: white;
        text-decoration: none;
        border-radius: 12px;
        font-weight: 600;
        text-align: center;
        transition: 0.3s;
      }
      .nav-btn:hover {
        background: #7919c2;
        transform: translateX(8px);
      }
      .nav-btn.retrain {
        background: #e28a2dff;
      }
      .nav-btn.retrain:hover {
        background: #c97424ff;
      }
      .nav-btn.logout {
        background: #e74c3c;
      }
      .nav-btn.logout:hover {
        background: #c0392b;
      }
      .nav-btn.flagged {
        background: #f33712ff;
      }
      .nav-btn.flagged:hover {
        background: #d9450bff;
      }

      /* MAIN CONTENT */
      .main-content {
        margin-left: 280px;
        padding: 40px;
        width: calc(100% - 280px);
      }
      .container {
        max-width: 1100px;
        margin: 0 auto;
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      }
      h1 {
        text-align: center;
        color: #4a00e0;
        margin-bottom: 10px;
      }
      p.subtitle {
        text-align: center;
        color: #666;
        font-size: 1.1em;
        margin-bottom: 40px;
      }
      .charts-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        margin-bottom: 40px;
      }
      .chart-container {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }
      .full-width {
        grid-column: 1 / -1;
      }
      canvas {
        max-height: 320px !important;
      }
      footer {
        text-align: center;
        color: #aaa;
        margin-top: 50px;
      }
      /* MODAL */
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
      }
      .modal-content {
        background: white;
        margin: 10% auto;
        padding: 30px;
        width: 90%;
        max-width: 500px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }
      .close {
        color: #aaa;
        float: right;
        font-size: 32px;
        font-weight: bold;
        cursor: pointer;
      }
      .close:hover {
        color: #000;
      }
      .modal h2 {
        color: #4a00e0;
        text-align: center;
        margin-bottom: 20px;
      }
      .modal label {
        display: block;
        margin: 15px 0;
        font-size: 1.1em;
      }
      .modal input[type="file"] {
        margin: 10px 0;
        padding: 10px;
        width: 100%;
      }
      .modal button {
        width: 100%;
        padding: 15px;
        background: #8e2de2;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
      }
      .modal button:hover {
        background: #7919c2;
      }
    </style>
  </head>
  <body>
    <!-- SIDEBAR -->
    <div class="sidebar">
      <h2>Admin Panel</h2>
      <a href="/history" class="nav-btn">View Full History</a>
      <a href="/flagged" class="nav-btn flagged"
        >View Flagged Posts ({{ flagged }})</a
      >
      <a href="/" class="nav-btn">Back to Detector</a>
      <a href="#" onclick="openModal()" class="nav-btn retrain"
        >Retrain Model</a
      >
      <a href="/retrain_logs" class="nav-btn">View Training Logs</a>
      <a href="/logout" class="nav-btn logout">Logout</a>
    </div>

    <!-- MAIN DASHBOARD CONTENT -->
    <div class="main-content">
      <div class="container">
        <h1>Admin Analytics Dashboard</h1>
        <p class="subtitle">
          Real-time insights from your AI Fake Job Detector
        </p>

        <div class="charts-grid">
          <div class="chart-container">
            <canvas id="pieChart"></canvas>
          </div>
          <div class="chart-container">
            <canvas id="barChart"></canvas>
          </div>
          <div class="chart-container full-width">
            <canvas id="lineChart"></canvas>
          </div>
        </div>

        <footer>
          <p>
            Secure Analytics Panel • Made with Love by <strong>Sainvi</strong> •
            December 2025
          </p>
        </footer>
      </div>
    </div>
    <!-- RETRAIN MODAL -->
    <div id="retrainModal" class="modal">
      <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2>Retrain Model</h2>
        <form id="retrainForm" enctype="multipart/form-data">
          <label
            ><input type="radio" name="source" value="default" checked /> Use
            Default Dataset</label
          >
          <label
            ><input type="radio" name="source" value="upload" /> Upload New
            Dataset (.csv)</label
          >
          <input
            type="file"
            name="dataset"
            id="fileInput"
            accept=".csv"
            style="display: none"
          />
          <button type="submit">Confirm & Retrain</button>
        </form>
      </div>
    </div>

    <!-- CHART.JS SCRIPTS -->
    <script>
      new Chart(document.getElementById('pieChart'), {
          type: 'doughnut',
          data: {
              labels: ['Fake Jobs', 'Real Jobs'],
              datasets: [{
                  data: [{{ fake }}, {{ real }}],
                  backgroundColor: ['#e74c3c', '#2ecc71'],
                  borderWidth: 3,
                  borderColor: '#fff'
              }]
          },
          options: {
              responsive: true,
              plugins: {
                  title: { display: true, text: 'Fake vs Real Jobs', font: { size: 16 } },
                  legend: { position: 'bottom' }
              }
          }
      });

      new Chart(document.getElementById('barChart'), {
          type: 'bar',
          data: {
              labels: ['Fake Jobs', 'Real Jobs'],
              datasets: [{
                  label: 'Average Confidence (%)',
                  data: [{{ "%.2f" % avg_fake_conf|default(0) }}, {{ "%.2f" % avg_real_conf|default(0) }}],
                  backgroundColor: ['#e74c3c', '#2ecc71'],
                  borderRadius: 8
              }]
          },
          options: {
              responsive: true,
              plugins: {
                  title: { display: true, text: 'Average Confidence Level', font: { size: 16 } }
              },
              scales: {
                  y: { beginAtZero: true, max: 100 }
              }
          }
      });

      new Chart(document.getElementById('lineChart'), {
          type: 'line',
          data: {
              labels: {{ dates|safe }},
              datasets: [{
                  label: 'Predictions Per Day',
                  data: {{ counts|safe }},
                  borderColor: '#8e2de2',
                  backgroundColor: 'rgba(142, 45, 226, 0.1)',
                  borderWidth: 3,
                  fill: true,
                  tension: 0.4,
                  pointBackgroundColor: '#8e2de2'
              }]
          },
          options: {
              responsive: true,
              plugins: {
                  title: { display: true, text: 'Daily Prediction Trend', font: { size: 18 } }
              },
              scales: {
                  y: { beginAtZero: true }
              }
          }
      });

      function confirmRetrain() {
        if (confirm("This will retrain the model. Continue?")) {
          fetch("/retrain_model", { method: "POST" })
            .then(r => r.json())
            .then(data => {
              if (data.success) alert(data.message);
              else alert("Retraining failed!");
            });
        }
      }
    </script>
    <script>
      function openModal() {
        document.getElementById("retrainModal").style.display = "block";
      }
      function closeModal() {
        document.getElementById("retrainModal").style.display = "none";
      }

      document.querySelectorAll('input[name="source"]').forEach((radio) => {
        radio.addEventListener("change", function () {
          document.getElementById("fileInput").style.display =
            this.value === "upload" ? "block" : "none";
        });
      });

      document
        .getElementById("retrainForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const formData = new FormData(this);
          fetch("/retrain_model", { method: "POST", body: formData })
            .then((r) => r.json())
            .then((data) => {
              alert(data.message + "\nSource: " + data.source);
              closeModal();
              location.reload();
            })
            .catch(() => alert("Error during retraining"));
        });

      window.onclick = function (event) {
        if (event.target == document.getElementById("retrainModal"))
          closeModal();
      };
    </script>
  </body>
</html>
