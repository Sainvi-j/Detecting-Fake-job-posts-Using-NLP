<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Result - Fake Job Detector</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #333;
        margin: 0;
        padding: 40px 20px;
        min-height: 100vh;
      }
      .container {
        max-width: 800px;
        margin: auto;
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        text-align: center;
      }
      .result {
        font-size: 32px;
        font-weight: 600;
        margin: 20px 0;
      }
      .fake {
        color: #e74c3c;
      }
      .real {
        color: #27ae60;
      }
      .confidence {
        font-size: 20px;
        margin: 20px 0;
      }
      progress {
        width: 80%;
        height: 30px;
        border-radius: 15px;
        margin: 20px auto;
        display: block;
      }
      progress::-webkit-progress-bar {
        background-color: #eee;
        border-radius: 15px;
      }
      progress::-webkit-progress-value {
        background: linear-gradient(90deg, #8e2de2, #4a00e0);
        border-radius: 15px;
      }
      .desc {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 12px;
        margin: 30px 0;
        text-align: left;
        font-size: 15px;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 30px;
        background: #8e2de2;
        color: white;
        text-decoration: none;
        border-radius: 12px;
        font-weight: 600;
      }
      a:hover {
        background: #7919c2;
      }
      footer {
        margin-top: 50px;
        color: #aaa;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Analysis Complete!</h1>

      <div class="result">
        {% if label == "Fake Job" %}
        <span class="fake">FAKE JOB DETECTED</span>
        {% else %}
        <span class="real">REAL JOB</span>
        {% endif %}
      </div>

      <div class="confidence">
        Confidence: <strong>{{ confidence }}%</strong>
      </div>

      <progress value="{{ confidence }}" max="100"></progress>

      <div class="desc">
        <p><strong>Job Description:</strong></p>
        <p>{{ description }}</p>
      </div>

      <a href="/">Check Another Job</a>

      <footer>
        <p>
          Developed by <strong>Sainvi</strong> | Fake Job Detection Using NLP
        </p>
      </footer>
    </div>
  </body>
</html>
