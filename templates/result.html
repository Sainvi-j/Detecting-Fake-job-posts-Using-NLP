<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Result - Sainvi</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        margin: 0;
        padding: 40px;
        min-height: 100vh;
      }
      .container {
        max-width: 800px;
        margin: auto;
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        text-align: center;
      }
      .result {
        font-size: 40px;
        font-weight: 600;
        margin: 20px 0;
      }
      .fake {
        color: #e74c3c;
      }
      .real {
        color: #27ae60;
      }
      .badge {
        padding: 8px 20px;
        border-radius: 30px;
        color: white;
        font-weight: bold;
      }
      .fake-badge {
        background: #e74c3c;
      }
      .real-badge {
        background: #27ae60;
      }
      progress {
        width: 80%;
        height: 35px;
        border-radius: 20px;
        margin: 20px auto;
      }
      progress::-webkit-progress-value {
        background: linear-gradient(90deg, #8e2de2, #4a00e0);
        border-radius: 20px;
      }
      progress::-webkit-progress-bar {
        background: #eee;
        border-radius: 20px;
      }
      .desc {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 12px;
        margin: 30px 0;
        text-align: left;
      }
      a {
        display: inline-block;
        padding: 12px 30px;
        background: #8e2de2;
        color: white;
        text-decoration: none;
        border-radius: 12px;
        font-weight: 600;
        margin: 20px;
      }
      a:hover {
        background: #7919c2;
      }
      .stats {
        background: #e8f5e8;
        padding: 20px;
        border-radius: 12px;
        margin: 20px 0;
      }
      footer {
        margin-top: 50px;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Result</h1>
      <div class="result {{ 'fake' if label == 'Fake Job' else 'real' }}">
        {{ label }}
      </div>
      <div
        class="badge {{ 'fake-badge' if label == 'Fake Job' else 'real-badge' }}"
      >
        {{ confidence }}% Confidence
      </div>
      <progress value="{{ confidence }}" max="100"></progress>

      <div class="desc">
        <p><strong>Job Description:</strong></p>
        <p>{{ description }}</p>
      </div>

      <div class="stats">
        <h3>Session Stats</h3>
        <p>
          Fake: <strong style="color: #e74c3c">{{ fake }}</strong> | Real:
          <strong style="color: #27ae60">{{ real }}</strong>
        </p>
      </div>

      <a href="/">Check Another Job</a>

      <footer>
        <p>Made with ❤️ by <strong>Sainvi</strong> • November 2025</p>
      </footer>
    </div>
  </body>
</html>
