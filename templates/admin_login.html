<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Login - Sainvi</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        margin: 0;
        padding: 40px;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-box {
        background: white;
        padding: 40px;
        width: 380px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        text-align: center;
      }
      h2 {
        color: #4a00e0;
        margin-bottom: 10px;
      }
      p {
        color: #666;
        margin-bottom: 30px;
      }
      input {
        width: 100%;
        padding: 14px;
        margin: 12px 0;
        border: 2px solid #ddd;
        border-radius: 12px;
        font-size: 16px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 15px;
        background: #8e2de2;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
      }
      button:hover {
        background: #7919c2;
        transform: translateY(-2px);
      }
      .error {
        color: #e74c3c;
        font-weight: bold;
        margin-top: 15px;
        padding: 10px;
        background: #ffebee;
        border-radius: 8px;
        border-left: 5px solid #e74c3c;
      }
      .back {
        display: block;
        margin-top: 20px;
        color: #8e2de2;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <h2>Admin Login</h2>
      <p>Secure access to analytics dashboard</p>

      <!-- FIXED: method="POST" added! -->
      <form method="POST">
        <input type="text" name="username" placeholder="Username" required />
        <input
          type="password"
          name="password"
          placeholder="Password"
          required
        />
        <button type="submit">Login</button>
      </form>

      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}

      <a href="/" class="back">Back to Detector</a>
    </div>
  </body>
</html>
